<!DOCTYPE html>
<html>
  <head>
      <meta charset="UTF-8">
    <title>SpotPlot</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1E1E1E;
        color: #FFFFFF;
        height: 100vh;
        overflow: hidden;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .rich-line:empty::before { content: attr(data-placeholder); color: rgba(255,255,255,0.28); pointer-events: none; }
    </style>
  </head>
  <script>
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => e.preventDefault());
</script>
  <body>
    <div id="root"></div>
  </body>
</html>
